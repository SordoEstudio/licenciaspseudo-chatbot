<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Asistente Licencia — San Vicente (prueba)</title>
  <style>
    /* Tema standalone (si se embebe en otra página, el host puede sobreescribir estas variables) */
    :root {
      --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --color-text-primary: #0f172a;
      --color-text-secondary: #64748b;
      --color-background-primary: #ffffff;
      --color-background-secondary: #f8fafc;
      --color-border-secondary: #e2e8f0;
      --color-border-tertiary: #e2e8f0;
      --border-radius-md: 8px;
      --border-radius-lg: 12px;
    }
    body {
      background: #f1f5f9;
      min-height: 100vh;
      margin: 0;
      padding: 0 12px;
    }
  </style>
</head>
<body>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:transparent}
#cw{font-family:var(--font-sans,sans-serif);max-width:620px;margin:0 auto;padding:1.5rem 0 2rem}
#hdr{display:flex;align-items:center;gap:12px;padding-bottom:1.25rem;border-bottom:.5px solid var(--color-border-tertiary);margin-bottom:1rem}
#hdr .logo{width:38px;height:38px;border-radius:var(--border-radius-md);background:#1a4fa0;display:flex;align-items:center;justify-content:center;flex-shrink:0}
#hdr .logo svg{width:20px;height:20px;fill:white}
#hdr h1{font-size:15px;font-weight:500;color:var(--color-text-primary);line-height:1.3}
#hdr p{font-size:12px;color:var(--color-text-secondary);margin-top:1px}
#msgs{display:flex;flex-direction:column;gap:12px}
.msg{display:flex;align-items:flex-start;gap:10px}
.msg.user{flex-direction:row-reverse}
.bubble{max-width:90%;padding:10px 14px;border-radius:var(--border-radius-lg);font-size:14px;line-height:1.65;color:var(--color-text-primary)}
.bot .bubble{background:var(--color-background-secondary);border:.5px solid var(--color-border-tertiary);border-radius:4px var(--border-radius-lg) var(--border-radius-lg) var(--border-radius-lg)}
.user .bubble{background:#e6f1fb;border:.5px solid #b5d4f4;color:#042c53;border-radius:var(--border-radius-lg) 4px var(--border-radius-lg) var(--border-radius-lg)}
.av{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;margin-top:2px}
.bot .av{background:#1a4fa0;color:white}
.user .av{background:#b5d4f4;color:#042c53}
#opts{margin-top:12px}
/* progress */
.pbar{display:flex;gap:4px;margin-bottom:1rem}
.ps{flex:1;height:3px;border-radius:2px;background:var(--color-border-tertiary);transition:background .3s}
.ps.on{background:#1a4fa0}.ps.dn{background:#0f6e56}
/* back */
.back-btn{background:transparent;border:.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:7px 12px;font-size:12px;color:var(--color-text-secondary);cursor:pointer;display:flex;align-items:center;gap:6px;margin-bottom:10px;transition:background .12s;width:fit-content}
.back-btn:hover{background:var(--color-background-secondary)}
/* confirm btn */
.cbtn-confirm{background:#1a4fa0;color:white;border:none;border-radius:var(--border-radius-md);padding:10px 16px;font-size:13px;cursor:pointer;width:100%;font-weight:500;opacity:.32;pointer-events:none;transition:opacity .2s;margin-top:8px;display:block}
.cbtn-confirm.on{opacity:1;pointer-events:all}
.cbtn-confirm.on:hover{opacity:.9}
/* single-select buttons */
.opt-btn{background:var(--color-background-primary);border:.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);padding:10px 14px;font-size:13px;color:var(--color-text-primary);cursor:pointer;text-align:left;display:flex;align-items:flex-start;gap:8px;margin-bottom:6px;width:100%;transition:background .12s,border-color .12s}
.opt-btn:hover{background:var(--color-background-secondary);border-color:#1a4fa0}
.opt-btn.sel{background:#e6f1fb;border-color:#1a4fa0;border-width:1.5px}
.opt-btn.sel .lbl{color:#0c447c;font-weight:500}
.opt-btn.dim{opacity:.42;cursor:not-allowed}
.opt-btn .ic{font-size:13px;width:18px;flex-shrink:0;margin-top:1px}
.opt-btn .ol{display:flex;flex-direction:column;gap:1px;flex:1}
.opt-btn .lbl{font-size:13px;color:var(--color-text-primary)}
.opt-btn .sub{font-size:11px;color:var(--color-text-secondary)}
/* badges */
.badge{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:500;display:inline-block;margin-bottom:6px}
.bi{background:#e6f1fb;color:#0c447c}.bo{background:#e1f5ee;color:#085041}.bw{background:#faeeda;color:#633806}
/* boxes */
.ibox{background:#e6f1fb;border:.5px solid #b5d4f4;border-radius:var(--border-radius-md);padding:10px 12px;font-size:13px;color:#0c447c;margin-top:8px;line-height:1.5}
.wbox{background:#faeeda;border:.5px solid #fac775;border-radius:var(--border-radius-md);padding:10px 12px;font-size:13px;color:#633806;margin-top:8px}
.gbox{background:#e1f5ee;border:.5px solid #9fe1cb;border-radius:var(--border-radius-md);padding:10px 12px;font-size:13px;color:#085041;margin-top:8px}
/* inputs */
input.date-inp,select.fsel{width:100%;font-size:13px;padding:9px 10px;border:.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);background:var(--color-background-primary);color:var(--color-text-primary);display:block;margin-top:6px}
.err{color:#a32d2d;font-size:12px;margin-top:4px;display:none}
/* typing */
.typing{display:flex;gap:4px;align-items:center;padding:10px 14px}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--color-text-secondary);animation:bl 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,80%,100%{opacity:.3}40%{opacity:1}}
/* ── Collapsible subclass selector ── */
.clase-block{border:.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);margin-bottom:8px;overflow:hidden}
.clase-toggle{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;background:var(--color-background-primary);user-select:none;transition:background .12s}
.clase-toggle:hover{background:var(--color-background-secondary)}
.clase-toggle.has-sel{background:#e6f1fb}
.clase-toggle .ct-ic{font-size:16px;flex-shrink:0}
.clase-toggle .ct-info{flex:1}
.clase-toggle .ct-name{font-size:13px;font-weight:500;color:var(--color-text-primary)}
.clase-toggle.has-sel .ct-name{color:#0c447c}
.clase-toggle .ct-sub{font-size:11px;color:var(--color-text-secondary);margin-top:1px}
.clase-toggle .ct-arrow{font-size:11px;color:var(--color-text-secondary);transition:transform .2s;flex-shrink:0}
.clase-toggle.open .ct-arrow{transform:rotate(90deg)}
.clase-subs{display:none;border-top:.5px solid var(--color-border-tertiary)}
.clase-subs.open{display:block}
.sub-row{display:flex;align-items:flex-start;gap:10px;padding:9px 12px;border-bottom:.5px solid var(--color-border-tertiary);cursor:pointer;transition:background .1s;background:var(--color-background-primary)}
.sub-row:last-child{border-bottom:none}
.sub-row:hover:not(.age-dim):not(.inc-row):not(.lock-row){background:var(--color-background-secondary)}
.sub-row.sel-row{background:#e6f1fb}
.sub-row.inc-row{background:#f1f5f9;cursor:default;border-left:3px solid #cbd5e1}
.sub-row.inc-row .sub-name{color:#64748b;font-weight:500}
.sub-row.inc-row .sub-desc{color:#94a3b8}
.sub-row.inc-row .chk{background:#cbd5e1;border-color:#cbd5e1}
.sub-row.lock-row{background:#f8fafc;cursor:default;opacity:.85;border-left:3px solid #e2e8f0}
.sub-row.lock-row .sub-name{color:#64748b}
.sub-row.lock-row .sub-desc{font-size:10px;color:#94a3b8;margin-top:2px}
.sub-row.lock-row .chk-ic{display:none!important}
.sub-row.age-dim{opacity:.38;cursor:not-allowed}
.chk{width:18px;height:18px;border-radius:4px;border:1.5px solid var(--color-border-secondary);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center}
.sel-row .chk{background:#1a4fa0;border-color:#1a4fa0}
.inc-row .chk{background:#cbd5e1;border-color:#cbd5e1}
.chk-ic{width:11px;height:11px;display:none}
.sel-row .chk-ic,.inc-row .chk-ic{display:block}
.sub-body{flex:1}
.sub-name{font-size:13px;color:var(--color-text-primary);line-height:1.3}
.sel-row .sub-name{color:#0c447c;font-weight:500}
.sel-row .chk-ic path{stroke:#fff!important}
.sub-row.inc-row .chk-ic path{stroke:#64748b!important}
.sub-desc{font-size:11px;color:var(--color-text-secondary);margin-top:2px}
.pill{font-size:10px;padding:1px 6px;border-radius:10px;margin-top:3px;display:inline-block;border:.5px solid}
.pill-age{background:#fcebeb;color:#791f1f;border-color:#f7c1c1}
/* req list */
.rlist{list-style:none;margin-top:8px;display:flex;flex-direction:column;gap:8px}
.ritem{border:.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);overflow:hidden}
.rhead{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--color-background-primary)}
.rnum{background:#1a4fa0;color:white;font-size:10px;font-weight:500;border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rbody{font-size:13px;color:var(--color-text-primary);flex:1;line-height:1.4}
.rbody small{display:block;color:var(--color-text-secondary);font-size:12px;margin-top:2px}
.ract{padding:8px 12px;border-top:.5px solid var(--color-border-tertiary);background:var(--color-background-secondary)}
.cta-btn{padding:8px 13px;border-radius:var(--border-radius-md);font-size:12px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:5px;border:.5px solid;font-weight:500}
.cp{background:#1a4fa0;color:white;border-color:#1a4fa0}
.cs{background:var(--color-background-primary);color:#1a4fa0;border-color:#b5d4f4}
.cg{background:#0f6e56;color:white;border-color:#0f6e56}
.cw{background:#25d366;color:white;border-color:#25d366}
.cr{background:#a32d2d;color:white;border-color:#a32d2d}
/* summary card */
.sc{background:var(--color-background-primary);border:.5px solid var(--color-border-secondary);border-radius:var(--border-radius-lg);padding:14px 16px;margin-top:8px}
.sr{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:.5px solid var(--color-border-tertiary);gap:12px}
.sr:last-child{border-bottom:none}
.sr span:first-child{color:var(--color-text-secondary);flex-shrink:0}
.sr span:last-child{font-weight:500;color:var(--color-text-primary);text-align:right}
/* turnero */
.tc{border:.5px solid var(--color-border-secondary);border-radius:var(--border-radius-lg);padding:14px;text-align:center;background:var(--color-background-primary);margin-top:8px}
.tc .ti{font-size:26px;margin-bottom:5px}
.tc h3{font-size:14px;font-weight:500;color:var(--color-text-primary);margin-bottom:4px}
.tc p{font-size:12px;color:var(--color-text-secondary);margin-bottom:10px;line-height:1.4}
/* sel summary tags */
.sel-tags{margin-top:6px;display:flex;flex-wrap:wrap;gap:4px}
.stag{font-size:12px;padding:3px 10px;border-radius:20px;background:#e6f1fb;color:#0c447c;border:.5px solid #b5d4f4}
.stag.prof{background:#faeeda;color:#633806;border-color:#fac775}
/* doc checklist */
.doc-section{margin-top:10px}
.doc-section>h4{font-size:13px;font-weight:600;color:var(--color-text-primary);margin-bottom:8px}
.doc-chk-row{display:flex;align-items:flex-start;gap:10px;margin-top:8px;padding:8px 0;border-top:.5px solid var(--color-border-tertiary)}
.doc-chk-row:first-of-type{border-top:none}
.doc-chk-row input[type=checkbox]{width:18px;height:18px;margin-top:2px;flex-shrink:0;accent-color:#1a4fa0;cursor:pointer}
.doc-chk-row .doc-chk-lbl{flex:1;font-size:13px;line-height:1.45}
.doc-chk-row .doc-chk-lbl small{display:block;color:var(--color-text-secondary);font-size:12px;margin-top:2px}
.sum-section{margin-top:16px;padding-top:12px;border-top:.5px solid var(--color-border-tertiary)}
.sum-section>h4{font-size:13px;font-weight:600;margin-bottom:8px}
.chk-datos{display:flex;align-items:flex-start;gap:10px;margin-top:14px;padding:10px 12px;background:var(--color-background-secondary);border-radius:var(--border-radius-md);border:.5px solid var(--color-border-tertiary)}
.chk-datos input{margin-top:2px;accent-color:#1a4fa0}
.dni-inp{width:100%;font-size:15px;padding:10px 12px;border:.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);letter-spacing:.05em}
.export-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.export-row .cta-btn,.export-row .opt-btn{flex:1;min-width:140px;justify-content:center}
.clase-block.prof-block-locked .clase-toggle{pointer-events:none;cursor:not-allowed;opacity:.62}
.clase-block.prof-block-locked .clase-toggle .ct-arrow{opacity:.45}
.fin-deriv .tc{text-align:left}
.fin-deriv .tc p{font-size:13px;line-height:1.5}
/* sequential requirements */
.req-item{border:.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);margin-bottom:8px;overflow:hidden;transition:border-color .2s,background .2s}
.req-item.req-active{border-color:#1a4fa0}
.req-item.req-pending{opacity:.42;pointer-events:none}
.req-item.req-done{border-color:#0f6e56;background:#f0faf6}
.req-hd{display:flex;align-items:flex-start;gap:10px;padding:10px 12px}
.req-chk-icon{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--color-border-secondary);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;color:transparent;transition:background .2s,border-color .2s,color .2s}
.req-done .req-chk-icon{background:#0f6e56;border-color:#0f6e56;color:white}
.req-act{padding:8px 12px 10px;border-top:.5px solid var(--color-border-tertiary);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.req-pending .req-act{display:none}
.req-lotengo{background:#1a4fa0;color:white;border:none;border-radius:var(--border-radius-md);padding:8px 14px;font-size:12px;cursor:pointer;font-weight:500;display:flex;align-items:center;transition:opacity .12s}
.req-lotengo:hover{opacity:.88}
.req-done .req-lotengo{display:none!important}
</style>

<script>
/* finContacto: "wa" | "mail" — canal para enviar el resumen al municipio (solo localidades propio:false)
   Si omitís finContacto: usa WhatsApp si hay wsp, si no mail. */
/* WhatsApp municipal (Argentina): 54 + 9 + código + número → 5493492646942 */
const CONTACTO_WHATSAPP_SV="5493492646942";

const LOCS={
  "San Vicente":{propio:true,wsp:CONTACTO_WHATSAPP_SV,mail:null},
  "Angélica":{propio:false,wsp:"5493406000001",mail:"tramites@angelica.gob.ar",finContacto:"wa"},
  "Plaza Clucellas":{propio:false,wsp:"5493406000002",mail:"consultas@plazaclucellas.gob.ar",finContacto:"wa"},
  "Colonia Margarita":{propio:false,wsp:"5493406000003",mail:"municipio@coloniamargarita.gob.ar",finContacto:"mail"},
  "Colonia Iturraspe":{propio:false,wsp:"5493406000004",mail:"info@coloniaiturraspe.gob.ar",finContacto:"wa"}
};

/* includes = subclases que quedan automáticamente incluidas si se elige esta */
const SUBS=[
  // Clase A — Motovehículos
  {cod:"A.2.1",label:"A.2.1 — Motocicletas hasta 150cc",desc:"Particular",edad:18,prof:false,inc:[],grupo:"A",gLabel:"Clase A — Motovehículos",ic:"🏍"},
  {cod:"A.2.2",label:"A.2.2 — Motocicletas de 150cc a 300cc",desc:"Particular — mayor de 21 años (o 20 con 2 años de A.2.1 vigente)",edad:21,prof:false,inc:["A.2.1"],grupo:"A",gLabel:"Clase A — Motovehículos",ic:"🏍"},
  {cod:"A.3",  label:"A.3 — Motocicletas de más de 300cc",desc:"Particular",edad:21,prof:false,inc:["A.2.2","A.2.1"],grupo:"A",gLabel:"Clase A — Motovehículos",ic:"🏍"},
  {cod:"A.4",  label:"A.4 — Motos para transporte comercial/industrial",desc:"Profesional — debe acompañarse de otra clase A",edad:21,prof:true,inc:[],grupo:"A",gLabel:"Clase A — Motovehículos",ic:"🏍"},
  // Clase B — Automóviles y camionetas
  {cod:"B.1",label:"B.1 — Automóviles, utilitarios y camionetas hasta 3.500 kg",desc:"Particular",edad:18,prof:false,inc:[],grupo:"B",gLabel:"Clase B — Automóviles y camionetas",ic:"🚗"},
  {cod:"B.2",label:"B.2 — B.1 con acoplado hasta 750 kg o casa rodante",desc:"Particular",edad:18,prof:false,inc:["B.1"],grupo:"B",gLabel:"Clase B — Automóviles y camionetas",ic:"🚗"},
  // Clase C — Camiones
  {cod:"C",label:"C — Camiones sin acoplado y casas rodantes de más de 3.500 kg",desc:"Profesional",edad:21,prof:true,inc:["B.1"],grupo:"C",gLabel:"Clase C — Camiones",ic:"🚛"},
  // Clase D — Transporte de pasajeros
  {cod:"D.1",label:"D.1 — Hasta 8 pasajeros (remis, taxi, transporte privado)",desc:"Profesional",edad:21,prof:true,inc:["B.1"],grupo:"D",gLabel:"Clase D — Transporte de pasajeros",ic:"🚌"},
  {cod:"D.2",label:"D.2 — Más de 8 pasajeros",desc:"Profesional",edad:21,prof:true,inc:["D.1","B.1"],grupo:"D",gLabel:"Clase D — Transporte de pasajeros",ic:"🚌"},
  {cod:"D.3",label:"D.3 — Urgencia, emergencia o similares",desc:"Profesional — debe acompañarse de clase B.1 o D.1",edad:21,prof:true,inc:[],grupo:"D",gLabel:"Clase D — Transporte de pasajeros",ic:"🚌"},
  // Clase E — Articulados y maquinaria no agrícola
  {cod:"E.1",label:"E.1 — Camiones articulados y/o con acoplado",desc:"Profesional",edad:21,prof:true,inc:["B.1"],grupo:"E",gLabel:"Clase E — Articulados y maquinaria no agrícola",ic:"⚙"},
  {cod:"E.2",label:"E.2 — Maquinaria especial no agrícola",desc:"Profesional",edad:21,prof:true,inc:[],grupo:"E",gLabel:"Clase E — Articulados y maquinaria no agrícola",ic:"⚙"},
  // Clase F — Adaptados para discapacidad
  {cod:"F",label:"F — Automotores incluidos en clase B o profesionales, adaptados",desc:"Debe acompañarse de B, C, D o E. Adaptación según la discapacidad del titular. Mayor de 18 años. Si acompaña a una clase profesional, requiere 2 años de antigüedad en B.",edad:18,prof:false,inc:[],grupo:"F",gLabel:"Clase F — Adaptados para discapacidad",ic:"♿"},
  // Clase G — Maquinaria agrícola
  {cod:"G.1",label:"G.1 — Tractores agrícolas",desc:"Mayor de 18 años",edad:18,prof:false,inc:[],grupo:"G",gLabel:"Clase G — Maquinaria agrícola",ic:"🚜"},
  {cod:"G.2",label:"G.2 — Maquinaria especial agrícola",desc:"Mayor de 18 años",edad:18,prof:false,inc:[],grupo:"G",gLabel:"Clase G — Maquinaria agrícola",ic:"🚜"},
];

function getIncluidas(selSet){
  const r=new Set();
  selSet.forEach(c=>{const s=SUBS.find(x=>x.cod===c);if(s)s.inc.forEach(i=>r.add(i));});
  return r;
}

let S={dni:"",localidad:"",tramiteLocal:true,nac:null,edad:0,tipo:"",licActuales:[],subclases:[],selUsuario:[],esProf:false,modoPostLic:null,skipReselectSubs:false};
const msgs=document.getElementById("msgs"),opts=document.getElementById("opts");

function setProg(n){for(let i=0;i<6;i++){const e=document.getElementById("ps"+i);e.className="ps"+(i<n?" dn":i===n?" on":"");}}
function calcEdad(d){const h=new Date(),n=new Date(d);let a=h.getFullYear()-n.getFullYear();const m=h.getMonth()-n.getMonth();if(m<0||(m===0&&h.getDate()<n.getDate()))a--;return a;}
/** Fechas en pantalla y en el resumen: día/mes/año (formato latino dd/mm/aaaa, desde ISO yyyy-mm-dd). */
function fmtFechaDMY(iso){
  if(!iso)return "—";
  const p=String(iso).split("-");
  if(p.length<3)return "—";
  const [y,m,d]=p;
  if(!y||!m||!d)return "—";
  return `${String(d).padStart(2,"0")}/${String(m).padStart(2,"0")}/${y}`;
}
function fmtFechaHoraAhora(){
  const n=new Date();
  const d=String(n.getDate()).padStart(2,"0");
  const mo=String(n.getMonth()+1).padStart(2,"0");
  const y=n.getFullYear();
  const hh=String(n.getHours()).padStart(2,"0");
  const mi=String(n.getMinutes()).padStart(2,"0");
  return `${d}/${mo}/${y}, ${hh}:${mi}`;
}
function isoToDmy(iso){
  if(!iso)return "";
  const p=String(iso).split("-");
  if(p.length<3)return "";
  return `${String(p[2]).padStart(2,"0")}/${String(p[1]).padStart(2,"0")}/${String(p[0])}`;
}
function dmyToIso(dmy){
  const m=String(dmy||"").trim().match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
  if(!m)return null;
  const dd=Number(m[1]),mm=Number(m[2]),yyyy=Number(m[3]);
  if(mm<1||mm>12||dd<1||dd>31)return null;
  const dt=new Date(yyyy,mm-1,dd);
  if(dt.getFullYear()!==yyyy||dt.getMonth()!==mm-1||dt.getDate()!==dd)return null;
  return `${String(yyyy).padStart(4,"0")}-${String(mm).padStart(2,"0")}-${String(dd).padStart(2,"0")}`;
}
function addUser(t){const d=document.createElement("div");d.className="msg user";d.innerHTML=`<div class="av">Vos</div><div class="bubble">${t}</div>`;msgs.appendChild(d);d.scrollIntoView({behavior:"smooth",block:"end"});}
function addBot(html,delay=0){return new Promise(res=>{setTimeout(()=>{const t=document.createElement("div");t.className="msg bot";t.innerHTML=`<div class="av">SV</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;msgs.appendChild(t);t.scrollIntoView({behavior:"smooth",block:"end"});setTimeout(()=>{t.remove();const d=document.createElement("div");d.className="msg bot";d.innerHTML=`<div class="av">SV</div><div class="bubble">${html}</div>`;msgs.appendChild(d);d.scrollIntoView({behavior:"smooth",block:"end"});res();},480);},delay);});}
function clearOpts(){
  if(window._optsEnterAbort){
    try{window._optsEnterAbort.abort();}catch(x){}
    window._optsEnterAbort=null;
  }
  if(typeof window._svEnterCleanup==="function"){

    window._svEnterCleanup=null;
  }

}
function addBack(fn,lbl="Volver al paso anterior"){const b=document.createElement("button");b.className="back-btn";b.innerHTML=`← ${lbl}`;b.onclick=()=>{clearOpts();fn();};opts.appendChild(b);}

/* ── Confirm button helper ── */
function makeConfirmBtn(label){
  const b=document.createElement("button");b.className="cbtn-confirm";b.textContent=label;return b;
}
function activateBtn(b,label){b.classList.add("on");if(label)b.textContent=label;}

/** Enter en el campo dispara el botón Confirmar cuando está activo (.on). */
function bindEnterSubmitInput(inputEl,btnEl){
  inputEl.addEventListener("keydown",e=>{
    if(e.key!=="Enter")return;
    if(!btnEl.classList.contains("on"))return;
    e.preventDefault();
    btnEl.click();
  });
}

/** Enter en el panel dispara la acción principal (Continuar / Ir al turno / enlace municipal) salvo en campos de texto o botones secundarios. */
function bindEnterToPrimaryButton(scopeEl,btnEl,opt){
  opt=opt||{};
  const reqOn=opt.requireOn!==false;
  if(window._optsEnterAbort){try{window._optsEnterAbort.abort();}catch(x){}}
  window._optsEnterAbort=new AbortController();
  const sig=window._optsEnterAbort.signal;
  scopeEl.addEventListener("keydown",function handler(e){
    if(e.key!=="Enter"||e.repeat)return;
    if(e.target===btnEl)return;
    const t=e.target;
    if(t.closest){
      if(t.closest("textarea"))return;
      const inp=t.closest("input");
      if(inp){
        const tp=inp.type;
        if(tp==="text"||tp==="email"||tp==="search"||tp==="tel"||tp==="password"||tp==="url")return;
        if(tp==="checkbox")return;
      }
      if(t.closest("select"))return;
    }
    if(t.classList&&(t.classList.contains("opt-btn")||t.classList.contains("back-btn")))return;
    if(t.closest&&(t.closest("button.cta-btn")||t.closest("a.cta-btn")))return;
    if(reqOn&&!btnEl.classList.contains("on"))return;
    if(!reqOn&&btnEl.classList.contains("cbtn-confirm")&&!btnEl.classList.contains("on"))return;
    e.preventDefault();
    btnEl.click();
  },{signal:sig});
}

/** Documentación: Enter en Sí/No (opt-btn) o Continuar cuando está habilitado. */
function bindEnterDocContinuar(scopeEl,goBtn){
  scopeEl.addEventListener("keydown",e=>{
    if(e.key!=="Enter"||e.repeat)return;
    const t=e.target;
    if(t&&t.closest&&t.closest("a"))return;
    if(t&&t.classList&&t.classList.contains("opt-btn")&&!t.classList.contains("dim")){
      e.preventDefault();
      t.click();
      return;
    }
    const cb=t&&t.closest&&t.closest("input[type=checkbox]");
    if(cb)return;
    if(!goBtn.classList.contains("on"))return;
    e.preventDefault();
    goBtn.click();
  });
}

/* ── Una opción = un tap (sin paso Confirmar intermedio) ── */
function pickOne(items,onPick,backFn,backLbl){

  items.forEach((item,i)=>{

    b.innerHTML=`<span class="ic">${item.icon||"›"}</span><div class="ol"><span class="lbl">${item.label}</span>${item.sub?`<span class="sub">${item.sub}</span>`:""}</div>`;
    if(!item.dim)b.onclick=()=>onPick(item,i);

/* ── Date input + confirmación explícita ── */
function showDate(hint,backFn,onConfirm,savedVal,cfg){
  const mode=(cfg&&cfg.mode)||"nacimiento";
  clearOpts();if(backFn)addBack(backFn);
  if(hint){const hintEl=document.createElement("p");hintEl.className="sub-desc";hintEl.style.marginBottom="8px";hintEl.style.color="var(--color-text-secondary)";hintEl.textContent=hint;opts.appendChild(hintEl);}
  const inp=document.createElement("input");inp.type="text";inp.className="date-inp";inp.inputMode="numeric";inp.autocomplete="off";inp.maxLength=10;inp.placeholder="dd/mm/aaaa";
  if(savedVal)inp.value=isoToDmy(savedVal);
  const err=document.createElement("p");err.className="err";
  const btn=makeConfirmBtn(mode==="nacimiento"?"Confirmar fecha de nacimiento":"Confirmar fecha de vencimiento");
  function validacionFecha(){
    const iso=dmyToIso(inp.value);
    if(!iso){return{ok:false,msg:"Ingresá la fecha en formato dd/mm/aaaa."};}
    if(mode==="nacimiento"){
      const hoy=new Date();
      const maxIso=`${hoy.getFullYear()}-${String(hoy.getMonth()+1).padStart(2,"0")}-${String(hoy.getDate()).padStart(2,"0")}`;
      if(iso>maxIso)return{ok:false,msg:"La fecha de nacimiento no puede ser futura."};
    }
    return{ok:true,iso};
  }
  function syncBtn(){
    if(!inp.value){btn.classList.remove("on");err.style.display="none";return;}
    const v=validacionFecha();
    if(!v.ok){err.textContent=v.msg;err.style.display="block";btn.classList.remove("on");return;}
    err.style.display="none";
    activateBtn(btn,mode==="nacimiento"?"Confirmar fecha de nacimiento":"Confirmar fecha de vencimiento");
  }
  inp.addEventListener("input",()=>{
    const raw=inp.value.replace(/[^\d]/g,"").slice(0,8);
    let fmt=raw;
    if(raw.length>4)fmt=raw.slice(0,2)+"/"+raw.slice(2,4)+"/"+raw.slice(4);
    else if(raw.length>2)fmt=raw.slice(0,2)+"/"+raw.slice(2);
    inp.value=fmt;
    syncBtn();
  });
  inp.addEventListener("blur",()=>{
    const n=inp.value.replace(/[^\d]/g,"").slice(0,8);
    if(n.length===8)inp.value=`${n.slice(0,2)}/${n.slice(2,4)}/${n.slice(4,8)}`;
    syncBtn();
  });
  if(savedVal)syncBtn();
  btn.onclick=()=>{
    if(!inp.value)return;
    const v=validacionFecha();
    if(!v.ok){err.textContent=v.msg;err.style.display="block";return;}
    err.style.display="none";
    onConfirm(v.iso);
  };
  bindEnterSubmitInput(inp,btn);
  opts.appendChild(inp);opts.appendChild(err);opts.appendChild(btn);
  opts.scrollIntoView({behavior:"smooth",block:"end"});
}

function showDni(backFn){
  clearOpts();if(backFn)addBack(backFn);
  const hint=document.createElement("p");hint.className="sub-desc";hint.style.marginBottom="8px";hint.style.color="var(--color-text-secondary)";
  hint.textContent="Sin puntos, solo números.";
  const inp=document.createElement("input");inp.type="text";inp.className="dni-inp";inp.inputMode="numeric";inp.autocomplete="off";inp.maxLength=10;inp.placeholder="Ej.: 38123456";
  if(S.dni)inp.value=S.dni;
  const err=document.createElement("p");err.className="err";
  const btn=makeConfirmBtn("Confirmar DNI");
  function norm(v){return v.replace(/\D/g,"");}
  function syncBtn(){
    const n=norm(inp.value);
    if(n.length>=7&&n.length<=9){activateBtn(btn,"Confirmar DNI");err.style.display="none";}
    else btn.classList.remove("on");
  }
  inp.addEventListener("input",()=>{inp.value=norm(inp.value);syncBtn();});
  if(S.dni)syncBtn();
  btn.onclick=()=>{
    const n=norm(inp.value);
    if(n.length<7||n.length>9){err.textContent="Ingresá un DNI válido (7 a 9 dígitos).";err.style.display="block";return;}
    S.dni=n;addUser(`DNI: ${n}`);paso1_loc();
  };
  bindEnterSubmitInput(inp,btn);
  opts.appendChild(hint);opts.appendChild(inp);opts.appendChild(err);opts.appendChild(btn);
  opts.scrollIntoView({behavior:"smooth",block:"end"});
}

/* ── Select — confirma al elegir opción (sin segundo botón) ── */
function showSelect(optsList,placeholder,backFn,onConfirm,savedVal){

/* ══ COLLAPSIBLE MULTI-SELECT SUBCLASS SELECTOR ══
   cfg.yaTiene = códigos ya en licencia (solo modo ampliación): fila bloqueada, tono gris
   cfg.ocultarFueraEdad = true: solo lista subclases permitidas por edad (ej. licencias actuales); sin aviso prof tras B */
function showSubclasSelector(edad,presel,onConfirm,backFn,cfg){
  cfg=cfg||{};
  const yaTiene=new Set(cfg.yaTiene||[]);
  clearOpts();if(backFn)addBack(backFn);
  const preselF=(presel||[]).filter(c=>{
    const sc=SUBS.find(s=>s.cod===c);
    if(!sc)return false;
    if(cfg.ocultarFueraEdad)return edad>=sc.edad||yaTiene.has(c);
    return true;
  });
  const selSet=new Set(preselF.filter(c=>!yaTiene.has(c)));
  const grupos=["A","B","C","D","E","F","G"];
  const rowMap={};
  const blockRefs=[];
  const blocksByGrupo={};
  const wrap=document.createElement("div");

  if(cfg.notaHtml){
    const nota=document.createElement("div");nota.className="ibox";nota.style.marginBottom="10px";
    nota.innerHTML=cfg.notaHtml;
    wrap.appendChild(nota);
  }

  function closeOtherBlocks(exceptBlock){
    blockRefs.forEach(({block,subsDiv,tog})=>{
      if(block!==exceptBlock){
        subsDiv.classList.remove("open");
        tog.classList.remove("open");
      }
    });
  }

  function appendGrupo(g){
    const subsAll=SUBS.filter(s=>s.grupo===g);
    const subs=cfg.ocultarFueraEdad
      ?subsAll.filter(sc=>edad>=sc.edad||yaTiene.has(sc.cod))
      :subsAll;
    if(!subs.length)return;
    const profLocked=edad<21&&["C","D","E"].includes(g)&&!cfg.ocultarFueraEdad;
    const block=document.createElement("div");block.className="clase-block"+(profLocked?" prof-block-locked":"");
    const tog=document.createElement("div");tog.className="clase-toggle";
    const head=subs[0];
    const subHint=profLocked?"No disponible hasta los 21 años":"Toca para ver subclases";
    tog.innerHTML=`<span class="ct-ic">${head.ic}</span><div class="ct-info"><div class="ct-name">${head.gLabel}</div><div class="ct-sub">${subHint}</div></div><span class="ct-arrow">▶</span>`;
    const subsDiv=document.createElement("div");subsDiv.className="clase-subs";

    tog.onclick=()=>{
      if(profLocked)return;
      const willOpen=!subsDiv.classList.contains("open");
      closeOtherBlocks(block);
      subsDiv.classList.toggle("open",willOpen);
      tog.classList.toggle("open",willOpen);
    };

    subs.forEach(sc=>{
      const canAge=edad>=sc.edad;
      const lockedYa=yaTiene.has(sc.cod);
      const row=document.createElement("div");row.className="sub-row";
      row.innerHTML=`<div class="chk"><svg class="chk-ic" viewBox="0 0 12 10"><path d="M1 5l3.5 3.5L11 1" stroke="white" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <div class="sub-body">
          <div class="sub-name">${sc.label}</div>
          <div class="sub-desc">${lockedYa?"Ya figura en tu licencia actual — no hace falta volver a marcarla":sc.desc}</div>
          ${!canAge&&!lockedYa&&!sc.prof?`<span class="pill pill-age">Requiere ${sc.edad} años (tenés ${edad})</span>`:""}
        </div>`;
      row.dataset.cod=sc.cod;
      rowMap[sc.cod]={row,subsDiv,tog,block};
      if(!canAge&&!lockedYa){row.classList.add("age-dim");}
      else if(lockedYa){row.classList.add("lock-row");row.onclick=null;}
      else{
        row.onclick=()=>{
          const inc=getIncluidas(selSet);
          if(inc.has(sc.cod))return;
          selSet.has(sc.cod)?selSet.delete(sc.cod):selSet.add(sc.cod);
          updateSelector(row);
        };
      }
      subsDiv.appendChild(row);
    });
    block.appendChild(tog);block.appendChild(subsDiv);
    wrap.appendChild(block);
    blockRefs.push({block,subsDiv,tog});
    blocksByGrupo[g]=block;
  }

  appendGrupo("A");
  appendGrupo("B");
  if(edad<21&&!cfg.ocultarFueraEdad){
    const av=document.createElement("div");av.className="wbox";av.style.marginBottom="10px";av.style.fontSize="13px";av.style.lineHeight="1.5";
    av.textContent="Debés ser mayor de 21 años para tramitar las clases profesionales";
    wrap.appendChild(av);
  }
  appendGrupo("C");
  appendGrupo("D");
  appendGrupo("E");
  appendGrupo("F");
  appendGrupo("G");
  const firstBlock=wrap.querySelector(".clase-block");
  if(!firstBlock){
    const av0=document.createElement("div");
    av0.className="wbox";
    av0.style.marginBottom="10px";
    av0.textContent="No encontramos subclases para mostrar con tu edad actual. Revisá la fecha de nacimiento o volvé al paso anterior.";
    wrap.appendChild(av0);
  }

  const sumWrap=document.createElement("div");
  sumWrap.style.cssText="margin-top:10px;background:var(--color-background-secondary);border:.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:10px 12px;font-size:13px;";
  const sumLbl=document.createElement("div");sumLbl.style.cssText="color:var(--color-text-secondary);font-size:12px;margin-bottom:4px;";sumLbl.textContent="Sin subclases seleccionadas";
  const tagWrap=document.createElement("div");tagWrap.className="sel-tags";
  sumWrap.appendChild(sumLbl);sumWrap.appendChild(tagWrap);
  wrap.appendChild(sumWrap);

  const errBox=document.createElement("div");errBox.className="wbox";
  errBox.style.cssText="margin-top:8px;display:none;font-size:13px;line-height:1.5";
  wrap.appendChild(errBox);

  function validarAcompanantes(eff){
    const arr=Array.from(eff);
    const errs=[];
    if(eff.has("F")){
      const tieneAcomp=arr.some(c=>/^[BCDE]/.test(c));
      if(!tieneAcomp)errs.push("La clase <strong>F</strong> debe ir acompañada de una clase B, C, D o E.");
    }
    if(eff.has("A.4")){
      const tieneOtraA=arr.some(c=>/^A\./.test(c)&&c!=="A.4");
      if(!tieneOtraA)errs.push("La clase <strong>A.4</strong> debe ir acompañada de otra clase A (A.2.1, A.2.2 o A.3).");
    }
    if(eff.has("D.3")){
      const acomp=["B.1","B.2","C","D.1","D.2","E.1","E.2"];
      const tieneAcomp=arr.some(c=>acomp.includes(c));
      if(!tieneAcomp)errs.push("La clase <strong>D.3</strong> debe ir acompañada de B.1 (o superior) o D.1.");
    }
    return errs;
  }

  const btn=makeConfirmBtn("Continuar");
  btn.onclick=()=>{
    const effective=new Set(selSet);
    yaTiene.forEach(c=>effective.add(c));
    const inc=getIncluidas(selSet);
    inc.forEach(c=>effective.add(c));
    if(!effective.size)return;
    const errs=validarAcompanantes(effective);
    if(errs.length){
      errBox.innerHTML=errs.map(e=>`⚠ ${e}`).join("<br>");
      errBox.style.display="block";
      errBox.scrollIntoView({behavior:"smooth",block:"nearest"});
      return;
    }
    errBox.style.display="none";
    const arr=Array.from(effective);
    S.selUsuario=Array.from(selSet).sort((a,b)=>a.localeCompare(b));
    S.subclases=arr;
    S.esProf=arr.some(c=>SUBS.find(s=>s.cod===c)?.prof);
    onConfirm(arr);
  };
  wrap.appendChild(btn);

  function subclasEnterGlobal(e){
    if(e.key!=="Enter"||e.repeat)return;
    if(!btn.classList.contains("on"))return;
    const ae=document.activeElement;
    if(ae){
      if(ae.classList&&ae.classList.contains("back-btn"))return;
      if(ae.tagName==="INPUT"&&(ae.type==="text"||ae.type==="email"))return;
      if(ae.tagName==="TEXTAREA")return;
      if(ae.tagName==="BUTTON"&&(ae.classList.contains("cta-btn")||ae.classList.contains("opt-btn")))return;
    }
    e.preventDefault();
    btn.click();
  }
  window.addEventListener("keydown",subclasEnterGlobal,true);
  window._svEnterCleanup=function(){window.removeEventListener("keydown",subclasEnterGlobal,true);};

  opts.appendChild(wrap);

  function updateSelector(lastClickedRow){
    if(errBox)errBox.style.display="none";
    const inc=getIncluidas(selSet);
    Object.entries(rowMap).forEach(([cod,o])=>{
      const row=o.row;
      const sc=SUBS.find(s=>s.cod===cod);
      const canAge=edad>=sc.edad;
      const lockedYa=yaTiene.has(cod);
      row.className="sub-row";
      if(lockedYa){row.classList.add("lock-row");return;}
      if(!canAge){row.classList.add("age-dim");return;}
      let hint=row.querySelector(".inc-hint");
      if(inc.has(cod)){
        row.classList.add("inc-row");
        if(!hint){hint=document.createElement("div");hint.className="sub-desc inc-hint";hint.style.fontSize="10px";hint.style.color="#94a3b8";hint.style.marginTop="4px";hint.textContent="Incluida automáticamente con tu selección";row.querySelector(".sub-body").appendChild(hint);}
      } else {
        if(hint)hint.remove();
        if(selSet.has(cod))row.classList.add("sel-row");
      }
    });
    grupos.forEach(g=>{
      const blockEl=blocksByGrupo[g];
      if(!blockEl)return;
      const subsAll=SUBS.filter(s=>s.grupo===g);
      const subs=cfg.ocultarFueraEdad
        ?subsAll.filter(sc=>edad>=sc.edad||yaTiene.has(sc.cod))
        :subsAll;
      const hasSel=subs.some(s=>selSet.has(s.cod)||yaTiene.has(s.cod)||inc.has(s.cod));
      const bt=blockEl.querySelector(".clase-toggle");
      const nSel=subs.filter(s=>selSet.has(s.cod)).length;
      const subEl=bt.querySelector(".ct-sub");
      bt.classList.toggle("has-sel",hasSel);
      if(blockEl.classList.contains("prof-block-locked")){
        subEl.textContent="No disponible hasta los 21 años";
        return;
      }
      if(yaTiene.size){
        subEl.textContent=nSel?`${nSel} nueva${nSel>1?"s":""}`:(hasSel?"Incluidas por tu licencia":"Toca para ver subclases");
      } else {
        subEl.textContent=nSel?`${nSel} seleccionada${nSel>1?"s":""}`:(hasSel?"Ver subclases":"Toca para ver subclases");
      }
    });
    tagWrap.innerHTML="";
    const totalEff=new Set(selSet);inc.forEach(c=>totalEff.add(c));yaTiene.forEach(c=>totalEff.add(c));
    const soloSel=Array.from(selSet).sort((a,b)=>a.localeCompare(b));
    if(totalEff.size===0){
      sumLbl.textContent="Sin subclases seleccionadas";
      btn.classList.remove("on");btn.textContent="Continuar";
    } else {
      sumLbl.textContent=soloSel.length?"Subclases elegidas por vos:":"Elegí al menos una subclase:";
      soloSel.forEach(c=>{
        const sc=SUBS.find(s=>s.cod===c);
        const t=document.createElement("span");t.className="stag"+(sc&&sc.prof?" prof":"");t.textContent=c;
        tagWrap.appendChild(t);
      });
      activateBtn(btn,`Continuar (${soloSel.length} seleccionada${soloSel.length!==1?"s":""})`);
    }
    if(lastClickedRow&&lastClickedRow.dataset.cod){
      const ref=rowMap[lastClickedRow.dataset.cod];
      if(ref){ref.subsDiv.classList.remove("open");ref.tog.classList.remove("open");}
    }
    opts.scrollIntoView({behavior:"smooth",block:"end"});
  }

  updateSelector();
  opts.scrollIntoView({behavior:"smooth",block:"end"});
}

/* ── Vencimiento ── */
async function paso3c_venc(){
  setProg(2);
  await addBot(`¿Cuándo vence (o venció) tu licencia?`);
  showDate("Figura en el frente de tu carné de conducir.",()=>{
    if(S.modoPostLic==="ampliar")paso4_ampliarDesdeLicencia();
    else if(S.modoPostLic==="renovar_igual")paso3bb_eleccionRenovAmp();
    else paso3b_licActuales();
  },(val)=>{
    const dias=(new Date()-new Date(val))/(1000*60*60*24);
    const fv=fmtFechaDMY(val);
    if(dias>365){
      const eraRenovarIgual=S.modoPostLic==="renovar_igual";
      const eraAmpliar=S.modoPostLic==="ampliar";
      S.modoPostLic=null;
      addUser(`Fecha de vencimiento: ${fv} — Vencida hace más de un año`);
      S.tipo="alta_forzada";
      if(eraRenovarIgual&&S.licActuales&&S.licActuales.length){
        S.skipReselectSubs=true;
        S.subclases=[...S.licActuales];
        S.esProf=S.subclases.some(c=>SUBS.find(s=>s.cod===c)?.prof);
        void (async()=>{
          await addBot(`Tu licencia venció hace más de un año: corresponde un <span class="badge bw">Alta</span> con exámenes completos (Ley 13.133).<br><br>Como elegiste renovar tus clases actuales, <strong>mantenemos las mismas subclases</strong> que ya habías indicado; las vas a ver en el resumen.`);
          paso5_requisitos();
        })();
      } else if(eraAmpliar&&S.subclases&&S.subclases.length){
        S.skipReselectSubs=true;
        S.esProf=S.subclases.some(c=>SUBS.find(s=>s.cod===c)?.prof);
        void (async()=>{
          await addBot(`Tu licencia venció hace más de un año: corresponde un <span class="badge bw">Alta</span> con exámenes completos (Ley 13.133).<br><br>Como ya elegiste las subclases a tramitar, <strong>las mantenemos en el resumen</strong>.`);
          paso5_requisitos();
        })();
      } else {
        S.skipReselectSubs=false;
        paso3d_altaForzada();
      }
    } else {
      S.tipo="renovacion";
      addUser(`Fecha de vencimiento: ${fv} — ${dias>0?"Vencida recientemente":"Aún vigente"}`);
      if(S.modoPostLic==="renovar_igual"){
        S.tipo="renovacion_simple";
        S.subclases=[...S.licActuales];
        paso5_requisitos();
      } else if(S.modoPostLic==="ampliar"){
        S.tipo="renovacion_ampliacion";
        paso5_requisitos();
      }
    }
  },null,{mode:"vencimiento"});
}

/** Compartir + copiar + correo simple (sin cuadro de destinatario). */
function appendExportToolbar(parent,txt){
  const subj=encodeURIComponent(`Licencia de conducir — DNI ${S.dni||""} — ${S.localidad||""}`);
  const body=encodeURIComponent(txt);
  const row=document.createElement("div");row.className="export-row";

  const bSh=document.createElement("button");bSh.type="button";bSh.className="cta-btn cg";bSh.innerHTML="⇄ Compartir resumen";
  bSh.onclick=async()=>{
    if(typeof navigator.share==="function"){
      try{
        await navigator.share({title:"Resumen — Licencia de conducir",text:txt});
        return;
      }catch(e){
        if(e&&e.name==="AbortError")return;
      }
    }
    try{
      await navigator.clipboard.writeText(txt);
      alert("Tu navegador no abre el panel de compartir aquí. Copiamos el resumen al portapapeles para que lo pegues donde quieras.");
    }catch(err){
      alert("No se pudo compartir ni copiar. Usá «Copiar resumen» o el correo más abajo.");
    }
  };
  row.appendChild(bSh);

  const bCp=document.createElement("button");bCp.type="button";bCp.className="cta-btn cg";bCp.innerHTML="📋 Copiar resumen";
  bCp.onclick=async()=>{
    try{
      await navigator.clipboard.writeText(txt);
      alert("Resumen copiado al portapapeles.");
    }catch(e){
      alert("No se pudo copiar. Seleccioná el texto desde el correo o contactá por WhatsApp.");
    }
  };
  row.appendChild(bCp);

  const bMail=document.createElement("button");bMail.type="button";bMail.className="cta-btn cp";bMail.innerHTML="✉ Enviar por correo";
  bMail.onclick=()=>{window.location.href=`mailto:?subject=${subj}&body=${body}`;};
  row.appendChild(bMail);

  parent.appendChild(row);
  return row;
}

function canalFinExterno(loc){
  const L=LOCS[loc];
  if(!L||L.propio)return"turno";
  if(L.finContacto==="mail")return"mail";
  if(L.finContacto==="wa")return"wa";
  if(L.mail&&!L.wsp)return"mail";
  if(L.wsp)return"wa";
  return L.mail?"mail":"wa";
}

}

/* ── Requisitos + Resumen integrado ── */
async function paso5_requisitos(){
  setProg(4);
  const tipoLabel={alta:"Alta — primera licencia",alta_forzada:"Alta — vencida más de 1 año",renovacion_simple:"Renovación simple",renovacion_ampliacion:"Renovación con ampliación"}[S.tipo];
  const nacFmt=fmtFechaDMY(S.nac);
  const subcDesc=S.selUsuario&&S.selUsuario.length?S.selUsuario.join(", "):S.subclases.join(", ");

  await addBot(`<span class="badge bi">Documentación y resumen</span><br>Confirmá que tenés cada documento antes de ir al municipio. Después revisamos tus datos y te damos el turno.`);

  setTimeout(()=>{
    clearOpts();
    addBack(backDesdeResumen,"Volver al paso anterior");

    let datosOk=false;
    const root=document.createElement("div");

    /* ── Sequential requirements ── */
    const REQS_BASE=[
      {
        title:"DNI vigente",
        desc:"Original y fotocopia. El domicilio debe figurar en San Vicente. Si el domicilio no figura, necesitás también el certificado de residencia.",
        action:null
      },
      {
        title:"Certificado CENAT",
        desc:"Certificado Nacional de Antecedentes de Tránsito. Se tramita y paga online — puede demorar hasta 48 hs hábiles.",
        action:{label:"Obtener CENAT online",cls:"cs",href:"https://www.santafe.gov.ar/cenat/",blank:true}
      },
      {
        title:"Declaración Jurada de Salud",
        desc:"Declarás bajo juramento tus aptitudes psicofísicas. Completala antes de ir al municipio.",
        action:{label:"Descargar Declaración Jurada (PDF)",cls:"cr",href:"#",blank:false}
      }
    ];
    const reqLibre={
      title:"Libre de multas municipal",
      desc:"Verificamos que no tenés infracciones firmes pendientes. Si tenés multas, primero regularizá la situación.",
      action:{label:"Solicitar por WhatsApp",cls:"cw",href:`https://wa.me/${CONTACTO_WHATSAPP_SV}?text=${encodeURIComponent("Hola, necesito el libre de multas para licencia de conducir.")}`,blank:true}
    };
    const REQS=S.esProf
      ?[REQS_BASE[0],REQS_BASE[1],REQS_BASE[2]]
      :[REQS_BASE[0],REQS_BASE[1],reqLibre,REQS_BASE[2]];
    const checkedCount=Array(REQS.length).fill(false);

    const docSec=document.createElement("div");docSec.className="doc-section";
    docSec.innerHTML="<h4>Revisá que tengas la documentación lista</h4>";

    const reqEls=[];

    function revealNext(i){
      if(i+1<REQS.length){
        reqEls[i+1].classList.remove("req-pending");
        reqEls[i+1].classList.add("req-active");
        setTimeout(()=>reqEls[i+1].scrollIntoView({behavior:"smooth",block:"nearest"}),80);
      } else {
        dataSec.style.display="";
        setTimeout(()=>dataSec.scrollIntoView({behavior:"smooth",block:"nearest"}),80);
      }
    }

    REQS.forEach((req,i)=>{
      const el=document.createElement("div");
      el.className="req-item "+(i===0?"req-active":"req-pending");

      const hd=document.createElement("div");hd.className="req-hd";
      const chkIc=document.createElement("div");chkIc.className="req-chk-icon";
      chkIc.innerHTML=`<svg viewBox="0 0 12 10" width="12" height="10"><path d="M1 5l3.5 3.5L11 1" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
      const bod=document.createElement("div");bod.style.flex="1";
      bod.innerHTML=`<div class="rbody"><strong>${i+1}. ${req.title}</strong><small>${req.desc}</small></div>`;
      hd.appendChild(chkIc);hd.appendChild(bod);
      el.appendChild(hd);

      const actWrap=document.createElement("div");actWrap.className="req-act";
      if(req.action){
        const a=document.createElement("a");a.href=req.action.href;
        if(req.action.blank){a.target="_blank";a.rel="noopener";}
        a.className=`cta-btn ${req.action.cls}`;a.textContent=req.action.label;
        if(!req.action.blank)a.addEventListener("click",e=>e.preventDefault());
        actWrap.appendChild(a);
      }
      const loBtn=document.createElement("button");
      loBtn.type="button";loBtn.className="req-lotengo";
      loBtn.innerHTML=`<svg viewBox="0 0 12 10" width="11" height="11" style="margin-right:5px"><path d="M1 5l3.5 3.5L11 1" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>Lo tengo`;
      loBtn.onclick=()=>{
        checkedCount[i]=true;
        el.classList.add("req-done");
        el.classList.remove("req-active");
        upd();
        revealNext(i);
      };
      actWrap.appendChild(loBtn);
      el.appendChild(actWrap);
      reqEls.push(el);
      docSec.appendChild(el);
    });

    root.appendChild(docSec);

    /* ── Summary + data confirm (hidden until all reqs done) ── */
    const dataSec=document.createElement("div");dataSec.style.display="none";

    const sumSec=document.createElement("div");sumSec.className="sum-section";
    sumSec.innerHTML="<h4>Corrobora tus datos</h4>";
    const sc=document.createElement("div");sc.className="sc";sc.style.marginTop="6px";
    sc.innerHTML=`
      <div class="sr"><span>DNI</span><span>${S.dni||"—"}</span></div>
      <div class="sr"><span>Localidad</span><span>${S.localidad||"—"}</span></div>
      <div class="sr"><span>Fecha de nacimiento</span><span>${nacFmt} (${S.edad} años)</span></div>
      <div class="sr"><span>Tipo de trámite</span><span>${tipoLabel}</span></div>
      <div class="sr"><span>Subclases (seleccionadas)</span><span>${subcDesc}</span></div>`;
    sumSec.appendChild(sc);
    if(S.tipo==="renovacion_ampliacion"){
      const w=document.createElement("div");w.className="ibox";w.style.marginTop="8px";
      w.textContent="La vigencia de las nuevas subclases se alineará al vencimiento de tu licencia actual (Art. 28, Ley 13.133).";
      sumSec.appendChild(w);
    }
    dataSec.appendChild(sumSec);

    const datosP=document.createElement("div");datosP.style.marginTop="14px";
    datosP.innerHTML="<strong>¿Son correctos estos datos?</strong>";
    dataSec.appendChild(datosP);
    const datosBtns=document.createElement("div");datosBtns.style.cssText="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap";
    const bDatSi=document.createElement("button");bDatSi.type="button";bDatSi.className="opt-btn";bDatSi.style.flex="1";bDatSi.style.minWidth="120px";
    bDatSi.innerHTML=`<span class="ic">✓</span><div class="ol"><span class="lbl">Sí</span></div>`;
    const bDatNo=document.createElement("button");bDatNo.type="button";bDatNo.className="opt-btn";bDatNo.style.flex="1";bDatNo.style.minWidth="120px";
    bDatNo.innerHTML=`<span class="ic">✗</span><div class="ol"><span class="lbl">No</span><span class="sub">Volver a ingresar</span></div>`;
    function allOk(){return checkedCount.every(Boolean)&&datosOk===true;}
    function upd(){}
    bDatSi.onclick=()=>{
      datosOk=true;
      bDatSi.classList.add("sel");
      bDatNo.classList.remove("sel");
      if(allOk()){
        addUser("Sí, son correctos");
        paso5b_preTurno({});
      }
    };
    bDatNo.onclick=()=>{
      datosOk=false;
      bDatNo.classList.add("sel");
      bDatSi.classList.remove("sel");
      paso2_nac_corregir();
    };
    datosBtns.appendChild(bDatSi);datosBtns.appendChild(bDatNo);
    dataSec.appendChild(datosBtns);
    bindEnterDocContinuar(dataSec,{classList:{contains:()=>allOk()},click:()=>{if(allOk()){addUser("Sí, son correctos");paso5b_preTurno({});}}});

    root.appendChild(dataSec);
    opts.appendChild(root);
    opts.scrollIntoView({behavior:"smooth",block:"end"});
  },400);
}

/* ── Turno ── */
async function paso6_turno(){
  setProg(5);
  await addBot(buildTurnero());
  setTimeout(()=>{
    clearOpts();
    addBack(()=>paso5b_preTurno({silent:true}),"Volver al resumen");

    const txt=textoResumenTramite();
    const pie=document.createElement("p");pie.className="sub-desc";pie.style.marginBottom="10px";
    pie.innerHTML="Podés <strong>compartir</strong>, <strong>copiar</strong> o <strong>abrir correo</strong> (con destinatario opcional) con el resumen; las mismas opciones siguen disponibles después de usar el turno.";
    opts.appendChild(pie);

    appendExportToolbar(opts,txt);

    const b=document.createElement("button");b.className="opt-btn";b.style.marginTop="12px";
    b.innerHTML=`<span class="ic">↺</span><div class="ol"><span class="lbl">Iniciar un trámite nuevo</span></div>`;
    b.onclick=reiniciar;opts.appendChild(b);
    opts.scrollIntoView({behavior:"smooth",block:"end"});
  },300);
}

function buildTurnero(){
  if(S.esProf){
    const msg=encodeURIComponent(`Hola, quiero tramitar subclases ${S.subclases.join(", ")}, solicito libre de multas y turno.`);
    return `<div class="tc"><div class="ti">💬</div><h3>Coordiná tu turno por WhatsApp</h3><p>Para licencias profesionales la gestión se realiza con nuestro equipo.</p>
    <a href="https://wa.me/${CONTACTO_WHATSAPP_SV}?text=${msg}" target="_blank" rel="noopener" class="cta-btn cw" style="width:100%;justify-content:center;font-size:13px;padding:10px;">Pedir libre de multas y solicitar turno</a></div>`;
  }
  if(S.tipo==="renovacion_simple"){
    return `<div class="tc"><div class="ti">🩺</div><h3>Turno — Examen psicofísico</h3><p>Para tu renovación solo necesitás el examen psicofísico.</p>
    <a href="#" onclick="alert('Aquí se abrirá el turnero de examen psicofísico')" class="cta-btn cp" style="width:100%;justify-content:center;font-size:13px;padding:10px;">Sacar turno — Examen psicofísico</a></div>`;
  }
  return `<div class="tc"><div class="ti">📋</div><h3>Turno — Examen teórico-práctico</h3><p>Para tu trámite de ${S.tipo==="renovacion_ampliacion"?"ampliación":"alta"} el primer paso es el examen teórico-práctico.</p>
  <a href="#" onclick="alert('Aquí se abrirá el turnero de examen teórico-práctico')" class="cta-btn cg" style="width:100%;justify-content:center;font-size:13px;padding:10px;">Sacar turno — Examen teórico-práctico</a></div>`;
}

async function paso7_feedback(){
  setProg(5);
  await addBot(`Gracias por usar el asistente. ¿Te resultó útil?`);
  pickOne([
    {icon:"😊",label:"Muy útil"},
    {icon:"😐",label:"Más o menos útil"},
    {icon:"😕",label:"Poco útil"}
  ],(it,idx)=>{
    addUser(it.label);
    paso7_feedback_detalle(idx);
  },()=>paso5b_preTurno({silent:true}),"Volver");
}

async function paso7_feedback_detalle(rating){
  const preguntas=[
    "¿Qué fue lo que más te gustó o por qué te sirvió?",
    "¿Qué cambiarías o mejorarías?",
    "¿Qué cambiarías o qué te faltó?"
  ];
  await addBot(preguntas[rating]);
  clearOpts();
  addBack(()=>paso7_feedback(),"Volver");
  const ta=document.createElement("textarea");
  ta.placeholder="Escribí tu comentario (opcional)";
  ta.style.cssText="width:100%;min-height:80px;font-size:13px;padding:9px 10px;border:.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);background:var(--color-background-primary);color:var(--color-text-primary);font-family:inherit;resize:vertical;margin-top:6px";
  opts.appendChild(ta);

  const btn=makeConfirmBtn("Enviar comentario");
  activateBtn(btn,"Enviar comentario");
  btn.onclick=()=>{
    const txt=ta.value.trim();
    if(txt)addUser(txt);
    else addUser("(sin comentario)");
    void (async()=>{
      await addBot("¡Gracias por tu feedback! Vamos a usarlo para mejorar.");
      clearOpts();
      const b=document.createElement("button");b.className="opt-btn";
      b.innerHTML=`<span class="ic">↺</span><div class="ol"><span class="lbl">Iniciar un trámite nuevo</span></div>`;
      b.onclick=reiniciar;opts.appendChild(b);
    })();
  };
  opts.appendChild(btn);
  opts.scrollIntoView({behavior:"smooth",block:"end"});
}

function reiniciar(){
  if(window._optsEnterAbort){
    try{window._optsEnterAbort.abort();}catch(x){}
    window._optsEnterAbort=null;
  }
  if(typeof window._svEnterCleanup==="function"){
    try{window._svEnterCleanup();}catch(x){}
    window._svEnterCleanup=null;
  }
  msgs.innerHTML="";opts.innerHTML="";
  S={dni:"",localidad:"",tramiteLocal:true,nac:null,edad:0,tipo:"",licActuales:[],subclases:[],selUsuario:[],esProf:false,modoPostLic:null,skipReselectSubs:false};
  paso0();
}

paso0();
</script>
